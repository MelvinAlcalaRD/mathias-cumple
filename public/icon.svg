<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdc425" />
      <stop offset="100%" stop-color="#ffbe1a" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#630ed4" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#purpleGrad)" />
  <!-- Inner Circle -->
  <circle cx="256" cy="256" r="190" fill="url(#grad)" stroke="#ffffff" stroke-width="14" />
  <!-- Bee stripes -->
  <ellipse cx="256" cy="256" rx="120" ry="90" fill="#251a00" />
  <ellipse cx="256" cy="256" rx="95" ry="90" fill="#fdc425" />
  <line x1="220" y1="168" x2="220" y2="344" stroke="#251a00" stroke-width="26" stroke-linecap="round" />
  <line x1="285" y1="168" x2="285" y2="344" stroke="#251a00" stroke-width="26" stroke-linecap="round" />
  <!-- Bee wings -->
  <ellipse cx="210" cy="150" rx="45" ry="32" fill="#ffffff" opacity="0.85" transform="rotate(-30 210 150)" />
  <ellipse cx="302" cy="150" rx="45" ry="32" fill="#ffffff" opacity="0.85" transform="rotate(30 302 150)" />
  <!-- Antennae -->
  <path d="M 230 170 Q 210 120 195 125" stroke="#251a00" stroke-width="8" fill="none" stroke-linecap="round" />
  <circle cx="195" cy="125" r="8" fill="#630ed4" />
  <path d="M 282 170 Q 302 120 317 125" stroke="#251a00" stroke-width="8" fill="none" stroke-linecap="round" />
  <circle cx="317" cy="125" r="8" fill="#630ed4" />
  <!-- Eyes & Smile -->
  <circle cx="340" cy="245" r="10" fill="#251a00" />
  <path d="M 335 265 Q 345 275 355 265" stroke="#251a00" stroke-width="5" fill="none" stroke-linecap="round" />
</svg>
